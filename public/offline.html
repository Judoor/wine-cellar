<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2416">
<title>Wine Cellar · Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: #ece2d0; color: #3a2517; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  h1 { font-family: Georgia, serif; font-weight: 400; font-size: 30px; margin: 20px 0 8px; }
  p { color: #85684d; max-width: 320px; margin: 0 auto 6px; line-height: 1.5; }
  button { margin-top: 20px; background: #8c2a2f; color: #fff; border: 0; border-radius: 4px; padding: 12px 22px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1 id="title">You are offline</h1>
    <p id="text">Your cellar server can't be reached. Check your connection (or your VPN), then try again.</p>
    <button id="retry" onclick="location.reload()">Try again</button>
  </main>
  <script>
    if (navigator.language.startsWith("fr")) {
      document.documentElement.lang = "fr";
      document.getElementById("title").textContent = "Vous êtes hors ligne";
      document.getElementById("text").textContent = "Le serveur de votre cave est injoignable. Vérifiez votre connexion (ou votre VPN), puis réessayez.";
      document.getElementById("retry").textContent = "Réessayer";
    }
  </script>
</body>
</html>
